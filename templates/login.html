<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HomeWatch — Login</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <div class="container" style="max-width: 400px; margin-top: 6rem;">
    <h1>HomeWatch</h1>
    <p class="subtitle">Network Security Monitor</p>

    <div class="card" style="margin-top: 2rem;">
      <h2>Sign in</h2>
      <form action="/login" method="POST" style="margin-top: 1rem;">
        <div style="margin-bottom: 0.75rem;">
          <input
            type="text"
            name="username"
            placeholder="Username"
            autocomplete="username"
            required
            style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem;"
          >
        </div>
        <div style="margin-bottom: 1rem;">
          <input
            type="password"
            name="password"
            placeholder="Password"
            autocomplete="current-password"
            required
            style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem;"
          >
        </div>
        {% if error %}
        <p style="color: #991b1b; font-size: 0.9rem; margin-bottom: 0.75rem;">{{ error }}</p>
        {% endif %}
        <button type="submit" style="width: 100%; padding: 0.75rem; background: #0f172a; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer;">
          Sign in
        </button>
      </form>
    </div>
  </div>

</body>
</html>
